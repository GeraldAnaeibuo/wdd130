<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Wild Oars River Rafting</title>
    <meta name="description"
      content="Contact Wild Oars River Rafting by phone, email, or our online form. Ask about trips and reservations, find us on the map, and meet our guides.">
    <meta name="author" content="Anaeibuo Chidozie">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Wild Oars River Rafting logo with crossed oars" width="137"
          height="98">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html" aria-current="page">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="page-title">Contact Us</h1>

        <section class="contact-info">
            <h2>Find Us</h2>
            <address>
                Wild Oars River Rafting<br>
                No. 29 Iroadi Street<br>
                Aba, Nigeria
            </address>
            <p>Phone: <a href="tel:+2349165657726">0916 565 7726</a></p>
            <p>Email: <a href="mailto:anaeibuochidozie@gmail.com">anaeibuochidozie@gmail.com</a></p>

            <iframe class="map"
              title="Map showing the location of Wild Oars River Rafting"
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d26415.672964597332!2d8.329588994327132!3d4.977480429912249!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x106787a7b2138c3b%3A0x487c527e7a76f2bd!2sBig%20Qua%20Town%2C%20Calabar%20540281%2C%20Cross%20River!5e1!3m2!1sen!2sng!4v1791135081442!5m2!1sen!2sng"
              width="600" height="300" allowfullscreen loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </section>

        <section class="staff">
            <h2>Meet Our Guides</h2>
            <div class="staff-grid">
                <figure>
                    <img src="images/john-precious.jpg" alt="Portrait of John Precious, head river guide"
                      width="200" height="200" loading="lazy">
                    <figcaption>John Precious<br>Head River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/chiamaka.jpg" alt="Portrait of Chiamaka, reservations manager"
                      width="200" height="200" loading="lazy">
                    <figcaption>Chiamaka<br>Reservations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/anaeibuo-chidozie.jpg" alt="Portrait of Anaeibuo Chidozie, owner and founder"
                      width="200" height="200" loading="lazy">
                    <figcaption>Anaeibuo Chidozie<br>Owner and Founder</figcaption>
                </figure>
            </div>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>
            <form action="#" method="post">
                <div class="field">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="field">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <fieldset>
                    <legend>Purpose of Your Message</legend>
                    <div class="option">
                        <input type="radio" id="general" name="purpose" value="general" required>
                        <label for="general">General Inquiry</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        <label for="suggestion">Website Suggestion</label>
                    </div>
                </fieldset>

                <div class="field">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>

                <div class="option">
                    <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit" class="submit-button">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Wild Oars River Rafting | Anaeibuo Chidozie</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook icon" width="32" height="32">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn icon" width="32" height="32">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram icon" width="32" height="32">
            </a>
        </nav>
    </footer>
</body>

</html>
